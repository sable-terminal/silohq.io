<style>
/* Layout: a schema map. Header with counts, a pannable canvas of Postgres schemas grouped by layer, and a side panel for one table or the stress-test findings. */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --sunk: #eceef2;
  --fg: #171a21;
  --fg-2: #4a5160;
  --fg-3: #7b8292;
  --line: #d6d9e0;
  --accent: #2f5bd3;
  --crit: #c02f45;
  --crit-bg: #fbe9ec;
  --high: #b5620a;
  --high-bg: #fcf0e2;
  --med: #6d6a1f;
  --med-bg: #f4f2dc;
  --l-source: #2b7a78;
  --l-ontology: #3f51b5;
  --l-operational: #7a4bb0;
  --l-writeback: #b0413e;
  --l-deploy: #8a6a12;
  --l-security: #33658a;
  --l-platform: #5c6170;
  --l-storage: #2f7d3a;
  --l-commercial: #9a4f7a;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12141a; --surface: #1b1e26; --sunk: #232733; --fg: #e8eaf0; --fg-2: #b4bac8; --fg-3: #858c9c; --line: #333847;
  --accent: #7d9cff; --crit: #ff7a8c; --crit-bg: #3a1d24; --high: #f0a456; --high-bg: #3a2914; --med: #d9d27a; --med-bg: #2f2d17;
  --l-source: #5cc4c0; --l-ontology: #8a9bff; --l-operational: #b98ae6; --l-writeback: #f08480; --l-deploy: #dcb54a;
  --l-security: #7fb2d9; --l-platform: #a4a9b8; --l-storage: #6fc57c; --l-commercial: #e08cbc; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12141a; --surface: #1b1e26; --sunk: #232733; --fg: #e8eaf0; --fg-2: #b4bac8; --fg-3: #858c9c; --line: #333847;
  --accent: #7d9cff; --crit: #ff7a8c; --crit-bg: #3a1d24; --high: #f0a456; --high-bg: #3a2914; --med: #d9d27a; --med-bg: #2f2d17;
  --l-source: #5cc4c0; --l-ontology: #8a9bff; --l-operational: #b98ae6; --l-writeback: #f08480; --l-deploy: #dcb54a;
  --l-security: #7fb2d9; --l-platform: #a4a9b8; --l-storage: #6fc57c; --l-commercial: #e08cbc; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 12px; box-sizing: border-box; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--fg-3); font-size: 12.5px; margin-top: 2px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--mono); font-size: 18px; font-weight: 600; }
.stat span { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.06em; }
.stat.crit b { color: var(--crit); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-left: auto; }
input[type=search] { font: inherit; font-family: var(--mono); font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); width: 220px; max-width: 100%; }
button, .chip { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--fg-3); }
button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; min-height: 0; }
.canvas { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-height: 0; touch-action: none; }
.canvas svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.canvas svg.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 11.5px; color: var(--fg-2); max-width: calc(100% - 160px); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .miss { border: 1.5px dashed var(--crit); background: var(--crit-bg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; padding: 10px; background: transparent; color: var(--fg-2); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--fg); box-shadow: inset 0 -2px 0 var(--fg); }
.pane { overflow: auto; padding: 14px 16px 20px; min-height: 0; flex: 1; }
.empty { color: var(--fg-3); font-size: 13px; line-height: 1.55; }
.tname { font-family: var(--mono); font-size: 16px; font-weight: 600; word-break: break-all; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--sunk); color: var(--fg-2); font-family: var(--mono); }
.tag.crit { background: var(--crit-bg); color: var(--crit); }
.tag.high { background: var(--high-bg); color: var(--high); }
.note { font-size: 13px; line-height: 1.5; color: var(--fg-2); margin: 0 0 12px; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg-3); margin: 16px 0 6px; font-weight: 600; }
table.cols { width: 100%; border-collapse: collapse; font-size: 12px; }
table.cols td { border-top: 1px solid var(--line); padding: 5px 4px; vertical-align: top; }
table.cols td.c { font-family: var(--mono); font-size: 11.5px; word-break: break-all; width: 38%; }
table.cols td.t { font-family: var(--mono); font-size: 11px; color: var(--fg-3); white-space: nowrap; }
table.cols td.n { color: var(--fg-2); font-size: 11.5px; line-height: 1.4; }
.rels { display: flex; flex-wrap: wrap; gap: 5px; }
.rels button { font-family: var(--mono); font-size: 11.5px; padding: 3px 7px; }
.finding { border: 1px solid var(--line); border-left: 3px solid var(--fg-3); border-radius: 6px; padding: 9px 11px; margin-bottom: 9px; }
.finding.Critical { border-left-color: var(--crit); }
.finding.High { border-left-color: var(--high); }
.finding.Medium { border-left-color: var(--med); }
.finding .sev { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
.finding.Critical .sev { color: var(--crit); } .finding.High .sev { color: var(--high); } .finding.Medium .sev { color: var(--med); }
.finding p { margin: 4px 0 6px; font-size: 13px; line-height: 1.45; }
.finding .area { font-size: 11px; color: var(--fg-3); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

svg text { font-family: var(--mono); }
.dom-box { fill: var(--sunk); }
.dom-title { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--fg); }
.dom-sub { font-family: var(--sans); font-size: 10.5px; fill: var(--fg-3); }
.card rect.body { fill: var(--surface); stroke: var(--line); }
.card text { font-size: 10.5px; fill: var(--fg); }
.card text.cnt { fill: var(--fg-3); font-size: 9.5px; }
.card.missing rect.body { fill: var(--crit-bg); stroke: var(--crit); stroke-dasharray: 4 3; stroke-width: 1.4; }
.card.missing text { fill: var(--crit); }
.card.sel rect.body { stroke: var(--fg); stroke-width: 2; }
.card.hit rect.body { stroke: var(--accent); stroke-width: 2; }
.card .flag { fill: var(--high); }
.card.dim { opacity: 0.18; }
.edge { fill: none; stroke: var(--fg-3); stroke-width: 0.8; opacity: 0.09; }
.edge.on-out { stroke: var(--accent); opacity: 0.9; stroke-width: 1.4; }
.edge.on-in { stroke: var(--high); opacity: 0.9; stroke-width: 1.4; }
.edge.gap { stroke: var(--crit); stroke-dasharray: 3 3; opacity: 0.35; }

@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 60vh auto; }
  .panel { max-height: 70vh; }
  .tools { margin-left: 0; }
  .legend { max-width: calc(100% - 20px); bottom: 52px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>

", "memberships"], ["token_transactions", "fde_engagements"], ["token_transactions", "memberships"], ["transitions", "connections"], ["transitions", "object_types"], ["transitions", "siloes"], ["view_preferences", "memberships"], ["view_preferences", "saved_views"], ["view_shares", "saved_views"], ["view_transfer_flags", "saved_views"], ["warehouse_projects", "siloes"], ["warehouse_sql_grants", "warehouse_projects"], ["warehouse_sync_runs", "warehouse_tables"], ["warehouse_tables", "object_types"], ["warehouse_tables", "ontology_versions"], ["warehouse_tables", "warehouse_projects"], ["webhook_endpoints", "connection_credentials"], ["webhook_endpoints", "connections"], ["workspace_preferences", "memberships"], ["writable_points", "connections"], ["writable_points", "connector_manifests"]], "layers": {"connect": "source", "ontology": "ontology", "clone": "operational", "workspace": "operational", "recognition": "operational", "simulation": "operational", "automation": "operational", "files": "operational", "action": "writeback", "fde": "deploy", "iam": "security", "gov": "security", "audit": "security", "platform": "platform", "siloes": "storage", "billing": "commercial"}};
const FINDINGS = [
{"sev":"Critical","area":"Audit, chapters 8 and 63","text":"The main audit ledger is never defined. About 570 audit event types write to audit_events, which chapters 8 and 63 name, but the only audit table specified is auth_events. Every governance claim in the spec rests on this table.","tables":["audit_events","auth_events"]},
{"sev":"Critical","area":"Connect, chapters 14 to 17","text":"There is no connectors table. connector_id appears in connections, connector_manifests, oauth_clients and oauth_pending_flows and points at nothing. The catalogue of about 300 prebuilt connectors, trust tiers and community promotion has nowhere to live.","tables":["connectors","connections","connector_manifests","oauth_clients","oauth_pending_flows"]},
{"sev":"Critical","area":"Silo Agent, chapter 10","text":"The Silo Agent has no tables. agent_id and agent_pool_id appear in five tables, but enrolment, certificates, versions, heartbeats and HA pools are never defined. Every on-premises connection depends on the agent.","tables":["agents","agent_pools","cdc_slots","connections","industrial_endpoints","discovery_authorisations","discovery_probes"]},
{"sev":"High","area":"Platform, chapters 6 to 13","text":"Six platform tables are named in Part II prose but never defined: outbox, model_calls, tenant_migrations, credential_unwraps, policy_versions and the operator access table. model_calls is the table that settles the measured cost per compile, which the pricing margin depends on.","tables":["outbox","model_calls","tenant_migrations","credential_unwraps","policy_versions","operators","operator_access_grants"]},
{"sev":"High","area":"Platform, chapters 6 and 63","text":"Operator access is named two ways: operator_access_sessions in chapter 7 and operator_access_grants in chapter 63. There is no operators table, so break-glass access cannot record which Silo staff member acted.","tables":["operator_access_grants","operators"]},
{"sev":"High","area":"Identity, chapters 26, 37 and 56","text":"organisations is defined three times with different columns: 18 in chapter 56, 6 in chapter 26 (calendar) and 3 in chapter 37 (sharing). They need to be one table definition.","tables":["organisations"]},
{"sev":"High","area":"Several chapters","text":"connection_credentials (chapters 15 and 61) and object_type_markings (chapters 21 and 57) are each defined twice. Two definitions of one table will drift.","tables":["connection_credentials","object_type_markings"]},
{"sev":"High","area":"Actions, chapter 43","text":"mutations.diff stores prior and proposed record values as plain jsonb, while prior_states.value is encrypted under the organisation key. The diff holds the same values, so the encryption on prior_states protects nothing.","tables":["mutations","prior_states"]},
{"sev":"High","area":"Scenarios, chapter 39","text":"staged_action_bases.base_value stores record values as plain jsonb in the control plane. Chapter 8's list of where record values may exist must include it, and it should be encrypted like prior_states.","tables":["staged_action_bases"]},
{"sev":"High","area":"Ask, chapter 36","text":"ask_turns.question stores the question as typed. A typed question can contain record values (a customer name, an invoice number). It is not in chapter 8's list of where values can exist, and no purge rule covers it.","tables":["ask_turns"]},
{"sev":"High","area":"Several chapters","text":"Polymorphic references have no referential integrity: grantee_id, resource_id, element_id, target_id, subject_id and object_id each point at different tables depending on a kind column. A deleted target leaves orphans silently, which matters most for connection_grants and resource_markings.","tables":["connection_grants","resource_markings","file_shares","lens_shares","approval_chains","favourites","dashboard_tiles","ontology_dependencies"]},
{"sev":"Medium","area":"Platform, chapter 6","text":"There is no cells table. cell_id appears in four tables, including organisation_directory, which routes every login.","tables":["cells","organisation_directory","identity_routing","organisations","fde_engagements"]},
{"sev":"Medium","area":"Crons and Home, chapters 33 and 40","text":"There is no notifications table. Crons with a notify or escalate action, and the Home briefing, need a record of what was delivered to whom and whether an escalation was acknowledged.","tables":["notifications","automation_runs","automation_actions"]},
{"sev":"Medium","area":"Exit, chapter 2.6","text":"There is no table for organisation export jobs, so an exit export has no status, contents list or receipt.","tables":["org_exports"]},
{"sev":"Medium","area":"Connect and billing, chapters 14 and 74","text":"The connector marketplace has no tables. The 70% revenue share to community authors cannot be calculated or paid.","tables":["marketplace_payouts","connectors"]},
{"sev":"Medium","area":"Recognition, chapter 38","text":"There is no detectors registry, and six of the seven federated detector names are still missing from the spec. findings, detector_runs and detector_thresholds refer to detectors by name only.","tables":["detectors","findings","detector_runs","detector_thresholds"]}
]
;
const LAYER_NAME = {source:"Source (Connect)", ontology:"Ontology", operational:"Operational", writeback:"Write-back", deploy:"AI FDE", security:"Security", platform:"Platform", storage:"Storage (Siloes)", commercial:"Commercial"};
const SCHEMA_TITLE = {connect:"connect",ontology:"ontology",clone:"clone",workspace:"workspace",recognition:"recognition",simulation:"simulation",automation:"automation",files:"files",action:"action",fde:"fde",iam:"iam",gov:"gov",audit:"audit",platform:"platform",siloes:"siloes",billing:"billing"};
const SCHEMA_SUB = {connect:"Connectors, credentials, streams, discovery",ontology:"Types, links, resolution, branches",clone:"Canvas, state rules, live subscriptions",workspace:"Shell, views, apps, Ask",recognition:"Detectors, findings, lenses",simulation:"Edges, scenarios, branches",automation:"Crons",files:"Exports and uploads",action:"Actions, approvals, receipts, revert",fde:"Engagements and proposals",iam:"Identity, scopes, roles, sessions",gov:"Markings, purpose, lineage",audit:"Audit ledgers",platform:"Cells, operations, exports",siloes:"Capture, Import, Index, Warehouse",billing:"Seats, tokens, contracts"};
const ROWS = [["workspace","clone","recognition"],["ontology","action"],["simulation","automation","files","fde"],["connect","siloes","billing"],["iam","gov","audit","platform"]];

const T = DATA.tables, byName = {};
T.forEach(t => byName[t.n] = t);
const out = {}, inn = {};
DATA.edges.forEach(([a,b]) => { (out[a] ||= []).push(b); (inn[b] ||= []).push(a); });
const flagged = {};
FINDINGS.forEach((f,i) => (f.tables||[]).forEach(n => (flagged[n] ||= []).push(i)));

// Layout
const CW = 178, CH = 24, GX = 8, GY = 6, PAD = 14, HEAD = 44, DGAP = 34;
const pos = {}, boxes = [];
let y = 0, maxW = 0;
ROWS.forEach(row => {
  let x = 0, rowH = 0;
  row.forEach(s => {
    const list = T.filter(t => t.s === s).sort((a,b) => (a.missing - b.missing) || ((inn[b.n]||[]).length - (inn[a.n]||[]).length) || a.n.localeCompare(b.n));
    const cols = Math.max(1, Math.round(Math.sqrt(list.length / 2.4)));
    const rowsN = Math.ceil(list.length / cols);
    const w = PAD*2 + cols*CW + (cols-1)*GX, h = HEAD + PAD + rowsN*(CH+GY) - GY + PAD;
    list.forEach((t,i) => { const c = Math.floor(i / rowsN), r = i % rowsN; pos[t.n] = {x: x+PAD+c*(CW+GX), y: y+HEAD+r*(CH+GY)}; });
    const layer = DATA.layers[s];
    boxes.push({s, x, y, w, h, layer, n: list.length, miss: list.filter(t=>t.missing).length});
    x += w + DGAP; rowH = Math.max(rowH, h);
  });
  maxW = Math.max(maxW, x - DGAP); y += rowH + DGAP;
});
const W = maxW, H = y - DGAP;

const NS = "http://www.w3.org/2000/svg";
const el = (n, a={}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const gN = document.getElementById("nodes"), gE = document.getElementById("edges");
boxes.forEach(b => {
  const g = el("g", {}, gN);
  el("rect", {x:b.x, y:b.y, width:b.w, height:b.h, rx:8, class:"dom-box"}, g);
  el("rect", {x:b.x, y:b.y, width:4, height:b.h, rx:2, fill:`var(--l-${b.layer})`}, g);
  const t = el("text", {x:b.x+PAD, y:b.y+20, class:"dom-title"}, g); t.textContent = SCHEMA_TITLE[b.s];
  const s = el("text", {x:b.x+PAD, y:b.y+34, class:"dom-sub"}, g); s.textContent = `${SCHEMA_SUB[b.s]} · ${b.n - b.miss} tables${b.miss?` · ${b.miss} missing`:""}`;
});
const edgeEls = [];
DATA.edges.forEach(([a,b]) => {
  const p = pos[a], q = pos[b]; if (!p || !q) return;
  const x1 = p.x + CW/2, y1 = p.y + CH/2, x2 = q.x + CW/2, y2 = q.y + CH/2;
  const dx = (x2-x1)*0.35;
  const path = el("path", {d:`M${x1},${y1} C${x1+dx},${y1+ (y2-y1)*0.1} ${x2-dx},${y2-(y2-y1)*0.1} ${x2},${y2}`, class:"edge"+((byName[a].missing||byName[b].missing)?" gap":"")}, gE);
  edgeEls.push({a,b,path});
});
const cardEls = {};
T.forEach(t => {
  const p = pos[t.n];
  const g = el("g", {class:"card"+(t.missing?" missing":""), transform:`translate(${p.x},${p.y})`, tabindex:"0", role:"button", "aria-label":`Table ${t.n}`}, gN);
  el("rect", {class:"body", width:CW, height:CH, rx:4}, g);
  el("rect", {width:3, height:CH, rx:1.5, fill:`var(--l-${DATA.layers[t.s]})`}, g);
  const label = t.n.length > 22 ? t.n.slice(0,21)+"…" : t.n;
  const tx = el("text", {x:9, y:16}, g); tx.textContent = label;
  const c = el("text", {x:CW-8, y:16, "text-anchor":"end", class:"cnt"}, g); c.textContent = t.missing ? "absent" : t.cols.length;
  if (flagged[t.n] && !t.missing) el("circle", {cx:CW-30, cy:CH/2, r:3.2, class:"flag"}, g);
  el("title", {}, g).textContent = t.n;
  g.addEventListener("click", e => { e.stopPropagation(); if (!moved) select(t.n); });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(t.n); } });
  cardEls[t.n] = g;
});

// Legend and stats
const lg = document.getElementById("legend");
Object.entries(LAYER_NAME).forEach(([k,v]) => { const s = document.createElement("span"); s.innerHTML = `<i style="background:var(--l-${k})"></i>${v}`; lg.appendChild(s); });
const ms = document.createElement("span"); ms.innerHTML = `<i class="miss"></i>Missing from spec`; lg.appendChild(ms);
const defined = T.filter(t=>!t.missing).length, missing = T.length - defined;
const sevCount = s => FINDINGS.filter(f=>f.sev===s).length;
document.getElementById("stats").innerHTML =
  `<div class="stat"><b>${defined}</b><span>Tables in spec</span></div>`+
  `<div class="stat crit"><b>${missing}</b><span>Missing tables</span></div>`+
  `<div class="stat"><b>${DATA.edges.length}</b><span>Relationships</span></div>`+
  `<div class="stat crit"><b>${sevCount("Critical")}</b><span>Critical</span></div>`+
  `<div class="stat"><b>${sevCount("High")}</b><span>High</span></div>`+
  `<div class="stat"><b>${sevCount("Medium")}</b><span>Medium</span></div>`;

// Pan and zoom
const svg = document.getElementById("svg"), vp = document.getElementById("vp");
let k = 1, tx = 0, ty = 0;
const apply = () => vp.setAttribute("transform", `translate(${tx},${ty}) scale(${k})`);
function fit() { const r = svg.getBoundingClientRect(); k = Math.min((r.width-24)/W, (r.height-24)/H); tx = (r.width - W*k)/2; ty = (r.height - H*k)/2; apply(); }
function zoomAt(f, cx, cy) { const nk = Math.min(4, Math.max(0.15, k*f)); tx = cx - (cx - tx)*(nk/k); ty = cy - (cy - ty)*(nk/k); k = nk; apply(); }
svg.addEventListener("wheel", e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*0.0015), e.clientX-r.left, e.clientY-r.top); }, {passive:false});
let drag = null, moved = false;
svg.addEventListener("pointerdown", e => { drag = {x:e.clientX, y:e.clientY, tx, ty, id:e.pointerId, cap:false}; moved = false; });
svg.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX-drag.x, dy = e.clientY-drag.y; if (!moved && Math.abs(dx)+Math.abs(dy) > 4) { moved = true; try { svg.setPointerCapture(drag.id); } catch (_) {} svg.classList.add("dragging"); } if (!moved) return; tx = drag.tx+dx; ty = drag.ty+dy; apply(); });
svg.addEventListener("pointerup", e => { drag = null; svg.classList.remove("dragging"); });
svg.addEventListener("click", e => { if (!moved && e.target === svg) select(null); });
document.getElementById("zin").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.3, r.width/2, r.height/2); };
document.getElementById("zout").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1/1.3, r.width/2, r.height/2); };
document.getElementById("fit").onclick = fit;
function centreOn(n) { const p = pos[n], r = svg.getBoundingClientRect(); if (k < 0.9) k = 1.1; tx = r.width/2 - (p.x+CW/2)*k; ty = r.height/2 - (p.y+CH/2)*k; apply(); }

// Selection
let selected = null, gapsOnly = false;
function paint() {
  const rel = new Set();
  if (selected) { rel.add(selected); (out[selected]||[]).forEach(n=>rel.add(n)); (inn[selected]||[]).forEach(n=>rel.add(n)); }
  T.forEach(t => {
    const g = cardEls[t.n];
    g.classList.toggle("sel", t.n === selected);
    const dim = (selected && !rel.has(t.n)) || (gapsOnly && !t.missing && !flagged[t.n]);
    g.classList.toggle("dim", !!dim);
  });
  edgeEls.forEach(({a,b,path}) => {
    path.classList.toggle("on-out", selected === a);
    path.classList.toggle("on-in", selected === b);
  });
}
const pane = document.getElementById("pane");
const tabF = document.getElementById("t-find"), tabT = document.getElementById("t-table");
function showTab(which) { tabF.setAttribute("aria-selected", which==="f"); tabT.setAttribute("aria-selected", which==="t"); which==="f" ? renderFindings() : renderTable(); }
tabF.onclick = () => showTab("f"); tabT.onclick = () => showTab("t");
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function select(n, centre) { selected = n; paint(); if (n) { if (centre) centreOn(n); showTab("t"); } }
function relButtons(list) { return list && list.length ? `<div class="rels">${[...new Set(list)].sort().map(n=>`<button data-go="${esc(n)}">${esc(n)}</button>`).join("")}</div>` : `<p class="empty">None.</p>`; }
function renderTable() {
  if (!selected) { pane.innerHTML = `<p class="empty">Select a table on the diagram, or search for one, to see its columns, its relationships and the findings that affect it. Blue lines are tables it references; orange lines are tables that reference it.</p>`; return; }
  const t = byName[selected];
  const fs = (flagged[t.n]||[]).map(i=>FINDINGS[i]);
  pane.innerHTML =
    `<div class="tname">${esc(t.s)}.${esc(t.n)}</div>`+
    `<div class="meta"><span class="tag" style="color:var(--l-${DATA.layers[t.s]})">${LAYER_NAME[DATA.layers[t.s]]}</span>`+
    (t.ch.length?`<span class="tag">Chapter ${t.ch.join(", ")}</span>`:"")+
    (t.missing?`<span class="tag crit">Not defined in spec</span>`:"")+(t.dup?`<span class="tag high">Defined ${t.ch.length} times</span>`:"")+`</div>`+
    (t.missing?`<p class="note">${esc(t.why)}</p>`:`<p class="note">${esc(t.store)}</p>`)+
    (fs.length?`<h3>Findings</h3>`+fs.map(findingHTML).join(""):"")+
    `<h3>References</h3>`+relButtons(out[t.n])+
    `<h3>Referenced by</h3>`+relButtons(inn[t.n])+
    (t.cols.length?`<h3>Columns (${t.cols.length})</h3><table class="cols"><tbody>${t.cols.map(c=>`<tr><td class="c">${esc(c[0])}</td><td class="t">${esc(c[1])}</td><td class="n">${esc(c[2])}</td></tr>`).join("")}</tbody></table>`:"");
}
function findingHTML(f) {
  return `<div class="finding ${f.sev}"><div class="sev">${f.sev}</div><p>${esc(f.text)}</p>`+
    (f.tables&&f.tables.length?`<div class="rels">${f.tables.map(n=>byName[n]?`<button data-go="${esc(n)}">${esc(n)}</button>`:"").join("")}</div>`:"")+
    `<div class="area">${esc(f.area)}</div></div>`;
}
let sevFilter = "All";
function renderFindings() {
  const list = FINDINGS.filter(f => sevFilter==="All" || f.sev===sevFilter);
  pane.innerHTML = `<div class="filters">${["All","Critical","High","Medium"].map(s=>`<button data-sev="${s}" aria-pressed="${s===sevFilter}">${s}</button>`).join("")}</div>`+ list.map(findingHTML).join("");
}
pane.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.go) select(b.dataset.go, true);
  if (b.dataset.sev) { sevFilter = b.dataset.sev; renderFindings(); }
});
document.getElementById("gaps").onclick = e => { gapsOnly = !gapsOnly; e.currentTarget.setAttribute("aria-pressed", gapsOnly); paint(); };
const q = document.getElementById("q");
q.addEventListener("input", () => {
  const v = q.value.trim().toLowerCase();
  T.forEach(t => cardEls[t.n].classList.toggle("hit", !!v && t.n.includes(v)));
});
q.addEventListener("keydown", e => { if (e.key === "Enter") { const v = q.value.trim().toLowerCase(); const m = T.find(t=>t.n===v) || T.find(t=>t.n.includes(v)); if (m) select(m.n, true); } });

renderFindings(); paint();
requestAnimationFrame(fit);
window.addEventListener("resize", fit);
</script>
